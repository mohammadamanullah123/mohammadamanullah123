<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 24" width="1200" height="24" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#00f5ff" stop-opacity="0"/>
      <stop offset="0.3" stop-color="#00f5ff"/>
      <stop offset="0.7" stop-color="#ff00e6"/>
      <stop offset="1" stop-color="#ff00e6" stop-opacity="0"/>
    </linearGradient>
    <filter id="glow" x="-10%" y="-300%" width="120%" height="700%">
      <feGaussianBlur stdDeviation="3" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect x="100" y="11" width="1000" height="2" fill="url(#g)" filter="url(#glow)"/>
  <rect x="585" y="6" width="30" height="12" fill="none" stroke="#00f5ff" stroke-width="2" transform="rotate(45 600 12)" filter="url(#glow)">
    <animate attributeName="stroke" values="#00f5ff;#ff00e6;#00f5ff" dur="3s" repeatCount="indefinite"/>
  </rect>
  <circle r="4" cy="12" fill="#ffffff" filter="url(#glow)">
    <animate attributeName="cx" values="100;1100;100" dur="4s" repeatCount="indefinite"/>
  </circle>
</svg>
