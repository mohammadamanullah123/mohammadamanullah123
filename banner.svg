<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" width="1200" height="400" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#03000c"/>
      <stop offset="0.55" stop-color="#150a3d"/>
      <stop offset="1" stop-color="#06122a"/>
    </linearGradient>
    <linearGradient id="sun" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ff00e6"/>
      <stop offset="1" stop-color="#00f5ff"/>
    </linearGradient>
    <linearGradient id="floor" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1b0b4d"/>
      <stop offset="1" stop-color="#02010a"/>
    </linearGradient>
    <linearGradient id="txt" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#00f5ff"/>
      <stop offset="0.5" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#ff00e6"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-50%" width="140%" height="200%">
      <feGaussianBlur stdDeviation="6" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <clipPath id="sunclip"><rect x="0" y="0" width="1200" height="250"/></clipPath>
  </defs>

  <!-- background -->
  <rect width="1200" height="400" fill="url(#bg)"/>

  <!-- stars -->
  <g fill="#ffffff">
    <circle cx="80" cy="40" r="1.5"><animate attributeName="opacity" values="1;0.1;1" dur="3s" repeatCount="indefinite"/></circle>
    <circle cx="190" cy="110" r="1"><animate attributeName="opacity" values="0.2;1;0.2" dur="2.4s" repeatCount="indefinite"/></circle>
    <circle cx="300" cy="55" r="1.8"><animate attributeName="opacity" values="1;0.2;1" dur="4s" repeatCount="indefinite"/></circle>
    <circle cx="420" cy="140" r="1"><animate attributeName="opacity" values="0.3;1;0.3" dur="2s" repeatCount="indefinite"/></circle>
    <circle cx="520" cy="30" r="1.4"><animate attributeName="opacity" values="1;0.1;1" dur="3.5s" repeatCount="indefinite"/></circle>
    <circle cx="700" cy="45" r="1.2"><animate attributeName="opacity" values="0.2;1;0.2" dur="2.8s" repeatCount="indefinite"/></circle>
    <circle cx="810" cy="120" r="1.8"><animate attributeName="opacity" values="1;0.2;1" dur="3.2s" repeatCount="indefinite"/></circle>
    <circle cx="930" cy="60" r="1"><animate attributeName="opacity" values="0.3;1;0.3" dur="2.2s" repeatCount="indefinite"/></circle>
    <circle cx="1040" cy="25" r="1.6"><animate attributeName="opacity" values="1;0.1;1" dur="4.2s" repeatCount="indefinite"/></circle>
    <circle cx="1130" cy="105" r="1.2"><animate attributeName="opacity" values="0.2;1;0.2" dur="3s" repeatCount="indefinite"/></circle>
    <circle cx="1100" cy="190" r="1"><animate attributeName="opacity" values="1;0.3;1" dur="2.6s" repeatCount="indefinite"/></circle>
    <circle cx="120" cy="200" r="1.3"><animate attributeName="opacity" values="0.3;1;0.3" dur="3.8s" repeatCount="indefinite"/></circle>
  </g>

  <!-- sun -->
  <g clip-path="url(#sunclip)">
    <circle cx="600" cy="215" r="105" fill="url(#sun)" opacity="0.55" filter="url(#glow)">
      <animate attributeName="opacity" values="0.45;0.7;0.45" dur="5s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- floor -->
  <rect x="0" y="250" width="1200" height="150" fill="url(#floor)"/>
  <g stroke="#00f5ff" stroke-width="1" opacity="0.55">
    <line x1="600" y1="250" x2="-700" y2="400"/>
    <line x1="600" y1="250" x2="-300" y2="400"/>
    <line x1="600" y1="250" x2="0" y2="400"/>
    <line x1="600" y1="250" x2="200" y2="400"/>
    <line x1="600" y1="250" x2="400" y2="400"/>
    <line x1="600" y1="250" x2="600" y2="400"/>
    <line x1="600" y1="250" x2="800" y2="400"/>
    <line x1="600" y1="250" x2="1000" y2="400"/>
    <line x1="600" y1="250" x2="1200" y2="400"/>
    <line x1="600" y1="250" x2="1500" y2="400"/>
    <line x1="600" y1="250" x2="1900" y2="400"/>
  </g>
  <g stroke="#ff00e6" stroke-width="1" opacity="0.5">
    <line x1="0" y1="260" x2="1200" y2="260"/>
    <line x1="0" y1="275" x2="1200" y2="275"/>
    <line x1="0" y1="295" x2="1200" y2="295"/>
    <line x1="0" y1="322" x2="1200" y2="322"/>
    <line x1="0" y1="358" x2="1200" y2="358"/>
  </g>
  <line x1="0" y1="250" x2="1200" y2="250" stroke="#00f5ff" stroke-width="2" filter="url(#glow)"/>

  <!-- animated scan line -->
  <rect x="0" y="0" width="1200" height="3" fill="#00f5ff" opacity="0.35">
    <animate attributeName="y" values="0;400;0" dur="6s" repeatCount="indefinite"/>
  </rect>

  <!-- HUD corners -->
  <g stroke="#00f5ff" stroke-width="3" fill="none" filter="url(#glow)">
    <path d="M20 60 V20 H60"/>
    <path d="M1140 20 H1180 V60"/>
    <path d="M20 340 V380 H60"/>
    <path d="M1140 380 H1180 V340"/>
  </g>

  <!-- title -->
  <text x="600" y="185" text-anchor="middle" font-family="'Courier New', Consolas, monospace" font-size="86" font-weight="700" letter-spacing="14" fill="url(#txt)" filter="url(#glow)">AMANULLAH</text>
  <text x="600" y="228" text-anchor="middle" font-family="'Courier New', Consolas, monospace" font-size="20" letter-spacing="8" fill="#ff00e6" filter="url(#glow)">[ AI · SYSTEMS · SOFTWARE ]</text>
  <text x="600" y="120" text-anchor="middle" font-family="'Courier New', Consolas, monospace" font-size="14" letter-spacing="6" fill="#00f5ff" opacity="0.9">
    SYSTEM ONLINE
    <animate attributeName="opacity" values="0.9;0.2;0.9" dur="2s" repeatCount="indefinite"/>
  </text>
</svg>
