<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 140" width="1200" height="140" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#150a3d" stop-opacity="0"/>
      <stop offset="1" stop-color="#03000c"/>
    </linearGradient>
    <linearGradient id="line" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#00f5ff"/>
      <stop offset="1" stop-color="#ff00e6"/>
    </linearGradient>
    <filter id="glow" x="-10%" y="-100%" width="120%" height="300%">
      <feGaussianBlur stdDeviation="4" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="1200" height="140" fill="url(#bg)"/>
  <g stroke="#00f5ff" stroke-width="1" opacity="0.25">
    <line x1="0" y1="60" x2="1200" y2="60"/>
    <line x1="0" y1="85" x2="1200" y2="85"/>
    <line x1="0" y1="115" x2="1200" y2="115"/>
  </g>
  <path d="M0 40 Q150 10 300 40 T600 40 T900 40 T1200 40" fill="none" stroke="url(#line)" stroke-width="3" filter="url(#glow)">
    <animate attributeName="d" dur="6s" repeatCount="indefinite"
      values="M0 40 Q150 10 300 40 T600 40 T900 40 T1200 40;
              M0 40 Q150 70 300 40 T600 40 T900 40 T1200 40;
              M0 40 Q150 10 300 40 T600 40 T900 40 T1200 40"/>
  </path>
  <text x="600" y="100" text-anchor="middle" font-family="'Courier New', Consolas, monospace" font-size="16" letter-spacing="5" fill="#00f5ff" filter="url(#glow)">BUILD THE FUTURE · ONE COMMIT AT A TIME</text>
  <text x="600" y="125" text-anchor="middle" font-family="'Courier New', Consolas, monospace" font-size="12" letter-spacing="3" fill="#ff00e6" opacity="0.8">© AMANULLAH</text>
</svg>
